<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoResume - Side Panel</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="panel-root">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="brand-logo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
        </div>
        <span class="brand-title">AutoResume</span>
        <span class="brand-badge">MCP</span>
      </div>

      <div class="header-tools">
        <button id="setActiveTabBtn" class="btn btn-secondary btn-xs" title="Lock visible browser tab as MCP target">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="22" y1="12" x2="18" y2="12"/>
            <line x1="6" y1="12" x2="2" y2="12"/>
            <line x1="12" y1="6" x2="12" y2="2"/>
            <line x1="12" y1="22" x2="12" y2="18"/>
          </svg>
          <span>Target</span>
        </button>

        <span id="bridgeBadge" class="status-pill waiting" title="WebSocket Bridge status">
          <span class="status-dot"></span>
          <span id="bridgeStatusText">Bridge</span>
        </span>
      </div>
    </header>

    <!-- Compact Stats Bar -->
    <section class="stats-bar">
      <div class="stat-item" id="statTabContainer" title="Click to lock current tab as active MCP tab">
        <svg class="stat-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="2"/>
          <line x1="2" y1="10" x2="22" y2="10"/>
        </svg>
        <span class="stat-val" id="statTabId">--</span>
      </div>

      <div class="stat-item" title="Tools executed on active page">
        <svg class="stat-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        <span class="stat-val" id="statToolsCount">0</span>
        <span class="stat-unit">ops</span>
      </div>

      <div class="stat-item" title="Uploaded documents & files">
        <svg class="stat-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
        <span class="stat-val" id="statFilesCount">0</span>
        <span class="stat-unit">files</span>
      </div>
    </section>

    <!-- 2-Tab Navigation -->
    <nav class="tabs-list">
      <button class="tabs-trigger active" data-tab="feedTab">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        <span>Live Stream</span>
      </button>

      <button class="tabs-trigger" data-tab="configTab">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" y1="21" x2="4" y2="14"/>
          <line x1="4" y1="10" x2="4" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="12"/>
          <line x1="12" y1="8" x2="12" y2="3"/>
          <line x1="20" y1="21" x2="20" y2="16"/>
          <line x1="20" y1="12" x2="20" y2="3"/>
          <line x1="1" y1="14" x2="7" y2="14"/>
          <line x1="9" y1="8" x2="15" y2="8"/>
          <line x1="17" y1="16" x2="23" y2="16"/>
        </svg>
        <span>Files &amp; Config</span>
      </button>
    </nav>

    <!-- Tab 1: Live Tool Feed -->
    <main class="tab-content active" id="feedTab">
      <div class="feed-toolbar">
        <div class="quick-actions-bar">
          <button id="startAutofillBtn" class="btn btn-primary btn-xs" title="Autofill active application form">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
            </svg>
            <span>Autofill</span>
          </button>

          <button id="verifyPageBtn" class="btn btn-secondary btn-xs" title="Inspect interactive accessibility tree">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <span>Inspect</span>
          </button>
        </div>

        <button id="clearFeedBtn" class="btn-ghost-icon" title="Clear live feed">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
          </svg>
        </button>
      </div>

      <div class="tool-list" id="toolListContainer">
        <!-- Rendered by sidepanel.js -->
        <div class="empty-state">
          <svg class="empty-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
          </svg>
          <p class="empty-title">Awaiting Agent Actions</p>
          <span class="empty-desc">Tool calls executed by external desktop AI (Claude, Cursor, agy) will stream live here.</span>
        </div>
      </div>
    </main>

    <!-- Tab 2: Files, AI Provider & Settings -->
    <main class="tab-content" id="configTab">
      <!-- Section A: Files & Resume -->
      <section class="config-card">
        <div class="card-header">
          <div class="card-title-group">
            <svg class="card-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
            </svg>
            <span class="card-title">Resume &amp; Preferences</span>
          </div>

          <div>
            <input type="file" id="realFileInput" style="display: none;" accept=".pdf,.md,.json,.txt" multiple />
            <button id="addFileBtn" class="btn btn-secondary btn-xs">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
              <span>Upload</span>
            </button>
          </div>
        </div>

        <div id="chatGreeting" class="applicant-status-banner">
          <span>No preferences loaded yet. Upload your Resume (.pdf, .md) or Preferences (.json) to begin.</span>
        </div>

        <div class="files-list" id="filesGridContainer">
          <!-- Rendered by sidepanel.js -->
        </div>
      </section>

      <!-- Section B: AI Provider Connection -->
      <section class="config-card">
        <div class="card-header">
          <div class="card-title-group">
            <svg class="card-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/>
              <path d="M2 12h20"/>
            </svg>
            <span class="card-title">AI Provider</span>
          </div>
        </div>

        <div class="provider-chips">
          <button class="provider-chip active" data-provider="gemini">Gemini</button>
          <button class="provider-chip" data-provider="claude">Claude</button>
          <button class="provider-chip" data-provider="openai">OpenAI</button>
          <button class="provider-chip" data-provider="general">Ollama</button>
        </div>

        <div class="form-group">
          <label for="apiKeyInput" id="apiKeyLabel" class="form-label">Gemini API Key</label>
          <input type="password" id="apiKeyInput" class="form-input" placeholder="Enter API Key (saved locally)" />
        </div>

        <div class="form-group">
          <label for="modelSelect" class="form-label">Model</label>
          <select id="modelSelect" class="form-select">
            <option value="gemini-2.0-flash">Gemini 2.0 Flash (Fastest)</option>
            <option value="gemini-1.5-pro">Gemini 1.5 Pro (Reasoning)</option>
          </select>
        </div>

        <button id="saveProviderBtn" class="btn btn-primary btn-sm btn-full">
          <span>Save Provider Config</span>
        </button>
      </section>

      <!-- Section C: Desktop MCP Bridge & Behavior -->
      <section class="config-card">
        <div class="card-header">
          <div class="card-title-group">
            <svg class="card-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="2" width="20" height="8" rx="2" ry="2"/>
              <rect x="2" y="14" width="20" height="8" rx="2" ry="2"/>
              <line x1="6" y1="6" x2="6.01" y2="6"/>
              <line x1="6" y1="18" x2="6.01" y2="18"/>
            </svg>
            <span class="card-title">MCP Bridge &amp; Options</span>
          </div>
        </div>

        <div class="port-row">
          <div class="port-input-wrapper">
            <label for="wsPortInput" class="form-label">Port</label>
            <input type="number" id="wsPortInput" class="form-input" value="9001" />
          </div>
          <button id="reconnectWsBtn" class="btn btn-secondary btn-sm" style="margin-top:auto;">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"/>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
            <span>Reconnect</span>
          </button>
        </div>

        <div class="toggles-list">
          <label class="switch-row">
            <span class="switch-label">Human typing simulation (20-40ms)</span>
            <input type="checkbox" id="humanTypingToggle" checked class="switch-input" />
            <span class="switch-slider"></span>
          </label>

          <label class="switch-row">
            <span class="switch-label">Highlight focused form fields</span>
            <input type="checkbox" id="visualOverlayToggle" checked class="switch-input" />
            <span class="switch-slider"></span>
          </label>

          <label class="switch-row">
            <span class="switch-label">Fail-fast on batch errors</span>
            <input type="checkbox" id="failFastToggle" checked class="switch-input" />
            <span class="switch-slider"></span>
          </label>
        </div>
      </section>
    </main>

    <!-- Floating Tooltip -->
    <div class="tooltip" id="globalTooltip"></div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
